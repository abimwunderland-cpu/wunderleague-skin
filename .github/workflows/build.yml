
name: Build WunderlandUniforms

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean build --no-daemon
          elif [ -f ./build.gradle ] || [ -f ./build.gradle.kts ]; then
            gradle clean build --no-daemon
          elif [ -f ./pom.xml ]; then
            mvn -B clean package
          else
            echo "ERROR: No Gradle or Maven build file found!"
            exit 1
          fi

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: WunderlandUniforms
          path: |
            build/libs/*.jar
            target/*.jar
          if-no-files-found: error
